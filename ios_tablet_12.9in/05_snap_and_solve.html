<script>
function fitToViewport() {
  var screen = document.querySelector('.screen');
  var w = 2048.00, h = 2732.00;
  var scale = Math.min(window.innerWidth / w, window.innerHeight / h) * 0.98;
  screen.style.transform = 'scale(' + scale + ')';
  screen.style.transformOrigin = 'center center';
}
window.addEventListener('resize', fitToViewport);
fitToViewport();
function autoFitText() {
  document.querySelectorAll('.ff').forEach(function(el) {
    var boxW = el.clientWidth, boxH = el.clientHeight;
    var origSize = parseFloat(el.dataset.origsize);
    var lhRatio = parseFloat(el.dataset.lhratio);
    var minSize = origSize * 0.45;
    el.style.paddingTop = '0px';
    var cur = origSize;
    var guard = 0;
    while ((el.scrollWidth > boxW + 1 || el.scrollHeight > boxH + 1) && cur > minSize && guard < 200) {
      cur -= 1;
      el.style.fontSize = cur + 'px';
      el.style.lineHeight = (cur * lhRatio) + 'px';
      guard++;
    }
    var extra = boxH - el.scrollHeight;
    if (extra > 0) {
      var valign = el.dataset.valign;
      if (valign === 'CENTER') el.style.paddingTop = (extra / 2) + 'px';
      else if (valign === 'BOTTOM') el.style.paddingTop = extra + 'px';
    }
  });
}
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(autoFitText);
}
window.addEventListener('load', autoFitText);
</script>
